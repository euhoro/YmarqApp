name: Expo updates check

# Expo ships patch releases often. Instead of failing PRs on the day a patch appears, check weekly and
# open (or update) one issue; fixing it is `npx expo install --fix` in a normal PR.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Expo doctor (with version check)
        id: doctor
        run: |
          set +e
          npx -y expo-doctor > doctor.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat doctor.txt
      - name: Open or update the maintenance issue
        if: steps.doctor.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Expo updates available"
          body=$(printf 'The weekly Expo check found outdated packages. Fix: run `npx expo install --fix`, then `npm run verify`, in a PR.\n\n```\n%s\n```' "$(cat doctor.txt)")
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label agent-ready --body "$body"
          fi
